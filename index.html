  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

0;\n  background: rgba(10,10,12,.7);\n  backdrop-filter: blur(14px) saturate(140%);\n  border-bottom:1px solid var(--hairline);\n}\nnav .container{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:60px;gap:2rem}\n.nav-cta-wrap{display:flex;justify-content:flex-end}\n.nav-links{justify-self:center}\n.nav-logo{display:flex;align-items:center;gap:.5rem;font-weight:600;font-size:.95rem;color:var(--ink)}\n.nav-logo .icon-box{\n  min-width:34px;height:26px;padding:0 .4rem;border-radius:6px;\n  background: var(--accent);\n  display:flex;align-items:center;justify-content:center;\n  color:var(--accent-ink);font-size:.7rem;font-weight:700;letter-spacing:.02em;\n  font-family:var(--mono);\n}\n.nav-logo .dim{color:var(--muted-2);font-weight:400;font-size:.78rem;margin-left:.25rem;font-family:var(--mono)}\n.nav-links{display:flex;gap:1.5rem}\n.nav-links a{color:var(--muted);font-size:.85rem;font-weight:400;transition:color .15s}\n.nav-links a:hover{color:var(--ink)}\n.nav-cta{\n  background:var(--accent);color:var(--accent-ink);\n  padding:.5rem 1rem;border-radius:8px;\n  font-weight:500;font-size:.82rem;\n  display:inline-flex;align-items:center;gap:.4rem;\n  transition: filter .15s;\n}\n.nav-cta:hover{filter:brightness(.95);color:var(--accent-ink)}\n\n/* ───── Hero ───── */\n.hero{\n  position:relative;\n  padding:10rem 0 6rem;\n  text-align:center;\n  overflow:hidden;\n}\n.hero-glow{\n  position:absolute;top:-20%;left:50%;transform:translateX(-50%);\n  width:1100px;height:700px;\n  background: radial-gradient(ellipse at center, rgba(20,111,245,.20), transparent 60%);\n  pointer-events:none;z-index:0;\n}\n.hero-inner{position:relative;z-index:2}\n\n/* ───── Hero wireframe (Star Wars crawl) ───── */\n.hero-stage{\n  position:absolute;\n  inset:0;\n  z-index:1;\n  pointer-events:none;\n  overflow:hidden;\n  perspective: 900px;\n  perspective-origin: 50% 0%;\n  opacity: .55;\n  -webkit-mask-image: radial-gradient(ellipse 75% 60% at 50% 30%, #000 8%, rgba(0,0,0,.35) 50%, rgba(0,0,0,.15) 75%, transparent 95%);\n          mask-image: radial-gradient(ellipse 75% 60% at 50% 30%, #000 8%, rgba(0,0,0,.35) 50%, rgba(0,0,0,.15) 75%, transparent 95%);\n}\n.hero-crawl{\n  position:absolute;\n  left:50%;\n  top:5%;\n  width:140vw;\n  max-width:1800px;\n  height:200%;\n  transform: translateX(-50%) rotateX(48deg);\n  transform-origin: 50% 0%;\n}\n.hero-crawl-track{\n  width:100%;height:100%;\n  animation: hero-scroll 90s linear infinite;\n}\n@keyframes hero-scroll{\n  from { transform: translateY(0); }\n  to   { transform: translateY(-50%); }\n}\n.hero-grid{\n  width:100%;\n  display:grid;\n  grid-template-columns: 1.4fr repeat(7, 1fr);\n  border-top:1px solid rgba(20,111,245,.35);\n  border-left:1px solid rgba(20,111,245,.18);\n}\n.hero-grid .hc, .hero-grid .hh{\n  border-right:1px solid rgba(20,111,245,.18);\n  border-bottom:1px solid rgba(20,111,245,.18);\n  padding:.55rem .8rem;\n  font-family: var(--mono);\n  font-size:.78rem;\n  color: rgba(180,210,255,.55);\n  height: 38px;\n  display:flex;align-items:center;\n  position:relative;\n  white-space:nowrap;overflow:hidden;\n}\n.hero-grid .hh{\n  background: linear-gradient(180deg, rgba(20,111,245,.22), rgba(20,111,245,.05));\n  border-bottom:1px solid rgba(20,111,245,.55);\n  color: rgba(220,235,255,.85);\n  font-size:.74rem;\n  font-weight:500;\n  letter-spacing:.04em;\n  text-transform:uppercase;\n  height: 44px;\n}\n.hero-grid .hh::after{\n  content:'';\n  position:absolute;right:8px;top:50%;\n  width:6px;height:6px;border-right:1px solid rgba(180,210,255,.4);\n  border-bottom:1px solid rgba(180,210,255,.4);\n  transform:translateY(-70%) rotate(45deg);\n  opacity:.6;\n}\n/* \"filled\" cells with a faint bar to suggest data — only on cells that opt in */\n.hero-grid .hc.hc-bar::before{\n  content:'';\n  position:absolute;left:.8rem;top:50%;transform:translateY(-50%);\n  height:6px;width: var(--w, 50%);\n  background: rgba(120,170,255,.18);\n  border-radius: 1px;\n}\n.hero-grid .hc.hc-bar.hc-num::before{ width:38%; background: rgba(120,170,255,.22) }\n.hero-grid .hc.hc-id{ color: rgba(140,180,255,.78); font-weight:500 }\n.hero-grid .hc.hc-pill::before{\n  height:14px;width:62px;border-radius:7px;\n  background: rgba(20,111,245,.22);\n  border:1px solid rgba(20,111,245,.5);\n}\n.hero-grid .hc.hc-pill.hc-amber::before{\n  background: rgba(255,184,107,.18);\n  border-color: rgba(255,184,107,.55);\n}\n.hero-grid .hc.hc-pill.hc-pink::before{\n  background: rgba(255,122,144,.18);\n  border-color: rgba(255,122,144,.55);\n}\n/* selected row glow */\n.hero-grid .hc.hc-sel{\n  background: rgba(20,111,245,.10);\n  box-shadow: inset 0 0 0 1px rgba(20,111,245,.55);\n}\n/* highlighted column (cursor) */\n.hero-grid .hc.hc-cur{\n  background: linear-gradient(90deg, rgba(20,111,245,.25), rgba(20,111,245,.0));\n}\n/* row banding */\n.hero-grid .hr-alt .hc{\n  background: rgba(120,170,255,.025);\n}\n\n/* Pulsing live dot in one cell — the cell renders no text */\n.hero-grid .hc.hc-live{ overflow:visible }\n.hero-grid .hc.hc-live::after{\n  content:'';\n  position:absolute;left:1rem;top:50%;\n  width:6px;height:6px;border-radius:50%;\n  background: var(--accent);\n  transform:translateY(-50%);\n  box-shadow: 0 0 0 0 rgba(20,111,245,.7);\n  animation: hero-pulse 2.4s ease-out infinite;\n}\n.hero-grid .hc.hc-live::before{ left: 1.85rem; width:34%; }\n@keyframes hero-pulse{\n  0%   { box-shadow: 0 0 0 0 rgba(20,111,245,.7) }\n  70%  { box-shadow: 0 0 0 12px rgba(20,111,245,0) }\n  100% { box-shadow: 0 0 0 0 rgba(20,111,245,0) }\n}\n\n/* Sweep highlight that travels down the grid */\n.hero-sweep{\n  position:absolute;\n  left:0;right:0;\n  height:120px;\n  background: linear-gradient(180deg,\n    transparent 0%,\n    rgba(20,111,245,.12) 45%,\n    rgba(110,170,255,.20) 50%,\n    rgba(20,111,245,.12) 55%,\n    transparent 100%);\n  filter: blur(2px);\n  animation: hero-sweep 14s ease-in-out infinite;\n  mix-blend-mode: screen;\n}\n@keyframes hero-sweep{\n  0% gin-right:auto;\n  text-wrap: balance;\n}\n.section-desc{\n  color:var(--muted);\n  font-size:1.05rem;\n  line-height:1.6;\n  text-wrap:pretty;\n  max-width:560px;\n  margin:0 auto;\n}\n\n/* ───── Playground (big bento card) ───── */\n.bento-row{display:grid;grid-template-columns:minmax(0, 1.4fr) minmax(0, .85fr);gap:1rem}\n.demo-card{\n  background:var(--surface);\n  border:1px solid var(--hairline);\n  border-radius:18px;\n  overflow:hidden;\n  position:relative;\n}\n.demo-top{\n  padding:.85rem 1.25rem;\n  border-bottom:1px solid var(--hairline);\n  background:var(--surface-2);\n  display:flex;align-items:center;gap:.5rem;\n}\n.demo-dots{display:flex;gap:.35rem}\n.demo-dot{width:10px;height:10px;border-radius:50%;background:#3a3a40}\n.demo-dot:nth-child(1){background:#ff5f57}\n.demo-dot:nth-child(2){background:#febc2e}\n.demo-dot:nth-child(3){background:#28c840}\n.demo-top-title{font-family:var(--mono);font-size:.74rem;color:var(--muted);margin-left:.5rem;flex:1;text-align:center}\n.demo-top-tag{\n  font-family:var(--mono);font-size:.66rem;color:var(--accent-ink);\n  background:var(--accent);padding:.2rem .55rem;border-radius:4px;font-weight:600;\n}\n\n.demo-body{display:grid;grid-template-columns:200px minmax(0, 1fr)}\n.demo-panel{\n  border-right:1px solid var(--hairline);\n  padding:1.5rem 1.25rem;\n  background:var(--surface-2);\n}\n.demo-panel h4{\n  font-size:.66rem;font-weight:500;\n  font-family:var(--mono);\n  text-transform:uppercase;letter-spacing:.12em;\n  color:var(--muted-2);margin:0 0 .85rem;\n}\n.demo-panel h4:not(:first-child){margin-top:1.25rem;padding-top:1.25rem;border-top:1px dashed var(--hairline)}\n.sw-row{\n  display:flex;align-items:center;justify-content:space-between;\n  padding:.55rem 0;cursor:pointer;\n}\n.sw-row span{font-size:.86rem;font-weight:400;color:var(--ink-2)}\n.sw{\n  width:34px;height:20px;border-radius:11px;background:var(--hairline-strong);\n  position:relative;cursor:pointer;transition:background .25s;flex-shrink:0;\n}\n.sw.on{background:var(--accent)}\n.sw::after{\n  content:'';position:absolute;top:2px;left:2px;\n  width:16px;height:16px;background:var(--surface);border-radius:50%;\n  transition:transform .25s cubic-bezier(.4,1.4,.5,1);\n}\n.sw.on::after{transform:translateX(14px);background:var(--accent-ink)}\n\n.demo-grid-wrap{padding:1rem;background:repeating-linear-gradient(45deg, var(--surface-2) 0 1px, transparent 1px 8px);min-width:0;overflow:hidden}\n.demo-scroll{\n  max-height:380px;overflow:auto;\n  border:1px solid var(--hairline);border-radius:10px;background:var(--surface);\n  scrollbar-width:thin;scrollbar-color: var(--hairline-strong) transparent;\n}\n.demo-scroll::-webkit-scrollbar{width:6px;height:6px}\n.demo-scroll::-webkit-scrollbar-thumb{background:var(--hairline-strong);border-radius:3px}\n.dg{display:grid;font-size:.78rem}\n.dg .c{\n  padding:.6rem .7rem;\n  border-bottom:1px solid var(--hairline);\n  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;\n  background:var(--surface);transition:all .25s;color:var(--ink-2);\n}\n.dg .ch{\n  background:var(--surface-2);\n  font-weight:500;color:var(--muted);\n  font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;\n  font-family:var(--mono);\n}\n.dg .ca{text-align:center;color:var(--accent)}\n.status-pill{\n  display:inline-flex;align-items:center;gap:.3rem;\n  font-family:var(--font);font-size:.72rem;\n  padding:.1rem .45rem;border-radius:4px;font-weight:400;\n}\n.status-pill::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor}\n.s-active{background:rgba(20,111,245,.14);color:var(--accent-2)}\n.s-pending{background:rgba(255,184,107,.12);color:var(--orange)}\n.s-progress{background:rgba(109,184,255,.12);color:var(--blue)}\n.s-rejected{background:rgba(255,122,144,.12);color:var(--pink)}\n.s-completed{background:var(--surface-3);color:var(--muted)}\n\n/* Floating side stats card */\n.side-cards{display:flex;flex-direction:column;gap:1rem;height:100%}\n.stat-card{\n  background:var(--surface);\n  border:1px solid var(--hairline);\n  border-radius:18px;\n  padding:1.5rem;\n  flex:1;\n  display:flex;flex-direction:column;\n}\n.stat-card .lbl{\n  font-family:var(--mono);font-size:.7rem;color:var(--muted-2);\n  text-transform:uppercase;letter-spacing:.08em;margin-bottom:.5rem;\n}\n.stat-card .num{\n  font-size:3rem;font-weight:500;letter-spacing:-.04em;line-height:1;\n  font-family:var(--mono);color:var(--ink);margin-bottom:.5rem;\n}\n.stat-card .num em{font-style:normal;color:var(--accent)}\n.stat-card .desc{font-size:.85rem;color:var(--muted);line-height:1.5;text-wrap:pretty;flex:1}\n.stat-card .footnote{font-size:.72rem;color:var(--muted-2);margin-top:1rem;font-family:var(--mono)}\n\n.live-feed{\n  background:var(--surface);\n  border:1px solid var(--hairline);\n  border-radius:18px;\n  padding:1.25rem;\n  flex:1;\n}\n.live-feed h4{\n  font-size:.68rem;font-family:var(--mono);\n  text-transform:uppercase;letter-spacing:.1em;color:var(--muted-2);\n  display:flex;align-items:center;gap:.5rem;\n  margin-bottom:1rem;font-weight:500;\n}\n.live-feed h4::before{\n  content:'';width:7px;height:7px;border-radius:50%;background:var(--accent);\n  box-shadow:0 0 0 0 var(--accent);\n  animation: pulse 2s infinite;\n}\n@keyframes pulse{\n  0%{box-shadow:0 0 0 0 rgba(20,111,245,.5)}\n  70%{box-shadow:0 0 0 8px transparent}\n  100%{box-shadow:0 0 0 0 transparent}\n}\n.feed-item{\n  display:grid;grid-template-columns:1fr auto;gap:.5rem;\n  padding:.55rem 0;border-bottom:1px dashed var(--hairline);\n}\n.feed-item:last-child{border-bottom:none}\n.feed-item .who{font-size:.85rem;color:var(--ink-2)}\n.feed-item .who small{display:block;color:var(--muted-2);font-size:.7rem;font-family:var(--mono);margin-top:2px}\n.feed-item .when{\n  font-family:var(--mono);font-size:.72rem;color:var(--accent);\n  align-self:center;\n}\n\n/* ───── Features (visitors-style cards with overlapping data) ───── */\n.feat-grid{display:grid;grid-template-columns:repeat(3,1fr); \u002Fhead>\n<body>\n\n<!-- ───── NAV ───── -->\n<nav><div class=\"container\">\n  <a href=\"#\" class=\"nav-logo\">\n    <div class=\"icon-box\">DG2+<\u002Fdiv>\n    Datagrid2+<span class=\"dim\">/ for Mendix<\u002Fspan>\n  <\u002Fa>\n  <div class=\"nav-links\">\n    <a href=\"#playground\">Playground<\u002Fa>\n    <a href=\"#features\">Features<\u002Fa>\n    <a href=\"#config\">Configuration<\u002Fa>\n    <a href=\"#install\">Install<\u002Fa>\n    <a href=\"#faq\">FAQ<\u002Fa>\n  <\u002Fdiv>\n  <div class=\"nav-cta-wrap\"><a href=\"https://github.com/tapmaurer-repo/mendix-widget-datagrid2-plus-public\" class=\"nav-cta\">Get on GitHub →<\u002Fa><\u002Fdiv>\n<\u002Fdiv><\u002Fnav>\n\n<!-- ───── HERO ───── -->\n<section class=\"hero\">\n  <div class=\"hero-glow\"><\u002Fdiv>\n  <div class=\"hero-stage\" aria-hidden=\"true\">\n    <div class=\"hero-crawl\">\n      <div class=\"hero-crawl-track\">\n        <div class=\"hero-grid\" id=\"hero-grid-1\"><\u002Fdiv>\n        <div class=\"hero-grid\" id=\"hero-grid-2\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"hero-sweep\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"hero-fog\" aria-hidden=\"true\"><\u002Fdiv>\n  <div class=\"container hero-inner\">\n    <div class=\"hero-eyebrow\">\n      <span class=\"new\">new<\u002Fspan>\n      v1.0.0 — drop-in for Mendix Datagrid 2\n    <\u002Fdiv>\n    <h1>Extend your Datagrid&nbsp;2,<br>with <em>one widget.<\u002Fem><\u002Fh1>\n    <p class=\"hero-sub\">Sticky behaviors, keyboard shortcuts, header control, cell styling, smart column selector — and growing. All configurable from Studio Pro.<\u002Fp>\n    <div class=\"hero-buttons\">\n      <a href=\"#playground\" class=\"btn-fill\">See it in action ↓<\u002Fa>\n      <a href=\"https://github.com/tapmaurer-repo/mendix-widget-datagrid2-plus-public\" class=\"btn-outline\">View on GitHub ↗<\u002Fa>\n    <\u002Fdiv>\n\n    <div class=\"brands\">\n      <div class=\"brand-item\">Mendix 9.24<\u002Fdiv>\n      <div class=\"brand-item\">Mendix 10<\u002Fdiv>\n      <div class=\"brand-item\">Mendix 11.6+ MTS<\u002Fdiv>\n      <div class=\"brand-item\">Datagrid 2 (CSS Grid)<\u002Fdiv>\n      <div class=\"brand-item\">GitHub release<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ───── PLAYGROUND + Stats ───── -->\n<section class=\"section\" id=\"playground\"><div class=\"container\">\n  <div class=\"section-head\">\n    <div class=\"section-label\">— playground —<\u002Fdiv>\n    <h2 class=\"section-title\">A live preview, not a screenshot.<\u002Fh2>\n    <p class=\"section-desc\">Toggle each feature and watch the grid respond. Twelve columns, real horizontal scroll — exactly what your Mendix users see.<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"bento-row\">\n    <div class=\"demo-card\">\n      <div class=\"demo-top\">\n        <div class=\"demo-dots\"><div class=\"demo-dot\"><\u002Fdiv><div class=\"demo-dot\"><\u002Fdiv><div class=\"demo-dot\"><\u002Fdiv><\u002Fdiv>\n        <div class=\"demo-top-title\">Datagrid2+ — live preview<\u002Fdiv>\n        <div class=\"demo-top-tag\">interactive<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"demo-body\">\n        <div class=\"demo-panel\">\n          <h4>Sticky options<\u002Fh4>\n          <div class=\"sw-row\" onclick=\"flip('h',this)\"><span>Sticky Header<\u002Fspan><div class=\"sw\"><\u002Fdiv><\u002Fdiv>\n          <div class=\"sw-row\" onclick=\"flip('f',this)\"><span>Sticky First Column<\u002Fspan><div class=\"sw\"><\u002Fdiv><\u002Fdiv>\n          <div class=\"sw-row\" onclick=\"flip('l',this)\"><span>Sticky Last Column<\u002Fspan><div class=\"sw\"><\u002Fdiv><\u002Fdiv>\n          <h4>Display<\u002Fh4>\n          <div class=\"sw-row\" onclick=\"flip('hh',this)\"><span>Hide Header<\u002Fspan><div class=\"sw\"><\u002Fdiv><\u002Fdiv>\n          <div class=\"sw-row\" onclick=\"flip('cb',this)\"><span>Cell Borders<\u002Fspan><div class=\"sw on\"><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"demo-grid-wrap\">\n          <div class=\"demo-scroll\" id=\"ds\"><div class=\"dg\" id=\"dg\"><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"side-cards\">\n      <div class=\"stat-card\">\n        <div class=\"lbl\">— configurable<\u002Fdiv>\n        <div class=\"num\"><em>9<\u002Fem>/9<\u002Fdiv>\n        <div class=\"desc\">Independent toggles. Use only sticky header. Or only the eye-icon merge. Or all of it. No all-or-nothing tax.<\u002Fdiv>\n        <div class=\"footnote\">3 sticky · 2 layout · 2 styling · 2 DX<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"live-feed\">\n        <h4>Studio Pro signals<\u002Fh4>\n        <div class=\"feed-item\">\n          <div class=\"who\">Sticky Header on, Max Height empty<small>warning · design-time<\u002Fsmall><\u002Fdiv>\n          <div class=\"when\">caught<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"feed-item\">\n          <div class=\"who\">Eye Icon merged into last col<small>info · runtime<\u002Fsmall><\u002Fdiv>\n          <div class=\"when\">applied<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"feed-item\">\n          <div class=\"who\">Datagrid 2 re-rendered (sort)<small>info · MutationObserver<\u002Fsmall><\u002Fdiv>\n          <div class=\"when\">re-applied<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"feed-item\">\n          <div class=\"who\">Multiple grid instances<small>info · scoped style tag<\u002Fsmall><\u002Fdiv>\n          <div class=\"when\">isolated<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<!-- ───── FEATURES ───── -->\n<section class=\"section\" id=\"features\"><div class=\"container\">\n  <div class=\"section-head\">\n    <div class=\"section-label\">— features —<\u002Fdiv>\n    <h2 class=\"section-title\">A growing toolkit, one widget.<\u002Fh2>\n    <p class=\"section-desc\">Nine focused tools today, more on the way. Every option independent, every option native to Studio Pro.<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"feat-grid\">\n    <div class=\"feat-card\">\n      <span class=\"feat-num\">01<\u002Fspan>\n      <div class=\"feat-icon b\">\n        <svg viewBox=\"0 0 30 30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n          <rect x=\"4\" y=\"5\" width=\"22\" height=\"5\" rx=\"1\" fill=\"currentColor\" fill-opacity=\".15\"><\u002Frect>\n          <rect x=\"4\" y=\"5\" width=\"22\" height=\"5\" rx=\"1\"><\u002Frect>\n          <line x1=\"4\" y1=\"14\" x2=\"26\" y2=\"14\" stroke-dasharray=\"2 2\" opacity=\".5\"><\u002Fline>\n          <line x1=\"4\" y1=\"19\" x2=\"26\" y2=\"19\" stroke-dasharray=\"2 2\" opacity=\".5\"><\u002Fline>\n          <line x1=\"4\" y1=\"24\" x2=\"26\" y2=\"24\" stroke-dasharray=\"2 2\" opacity=\".5\"><\u002Fline>\n          <path d=\"M11 2.5 L15 .5 L19 2.5\" opacity=\".7\"><\u002Fpath>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div class=\"feat-tag\"><span class=\"dot b\"><\u002Fspan>Sticky<\u002Fdiv>\n      <h3>Sticky Header<\u002Fh3>\n      <p>Column headers stay pinned while scrolling. Configurable max-height for the Datagrid 2 scroll area.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"feat-card\">\n      <span class=\"feat-num\">02<\u002Fspan>\n      <div class=\"feat-icon b\">\n        <svg viewBox=\"0 0 30 30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n          <rect x=\"4\" y=\"5\" width=\"6\" height=\"20\" rx=\"1\" fill=\"currentColor\" fill-opacity=\".15\"><\u002Frect>\n          <rect x=\"4\" y=\"5\" width=\"6\" height=\"20\" rx=\"1\"><\u002Frect>\n          <line x1=\"14\" y1=\"8\" x2=\"26\" y2=\"8\" stroke-dasharray=\"2 2\" opacity=\".5\"><\u002Fline>\n          <line x1=\"14\" y1=\"13\" x2=\"26\" y2=\"13\" stroke-dasharray=\"2 2\" opacity=\".5\"><\u002Fline>\n          <line x1=\"14\" y1=\"18\" x2=\"26\" y2=\"18\" stroke-dasharray=\"2 2\" opacity=\".5\"><\u002Fline>\n          <line x1=\"14\" y1=\"23\" x2=\"26\" y2=\"23\" stroke-dasharray=\"2 2\" opacity=\".5\"><\u002Fline>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div class=\"feat-tag\"><span class=\"dot b\"><\u002Fspan>Sticky<\u002Fdiv>\n      <h3>Sticky First Column<\u002Fh3>\n      <p>Pin the identifier column. Custom min-width and background for the first column.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"feat-card\">\n      <span class=\"feat-num\">03<\u002Fspan>\n      <div class=\"feat-icon b\">\n        <svg viewBox=\"0 0 30 30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n          <rect x=\"20\" y=\"5\" width=\"6\" height=\"20\" rx=\"1\" fill=\"currentColor\" fill-opacity=\".15\"><\u002Frect>\n          <rect x=\"20\" y=\"5\" width=\"6\" height=\"20\" rx=\"1\"><\u002Frect>\n          <line x1=\"4\" y1=\"8\" x2=\"16\" y2=\"8\" stroke-dasharray=\"2 2\" opacity=\".5\"><\u002Fline>\n          <line x1=\"4\" y1=\"13\" x2=\"16\" y2=\"13\" stroke-dasharray=\"2 2\" opacity=\".5\"><\u002Fline>\n          <line x1=\"4\" y1=\"18\" x2=\"16\" y2=\"18\" stroke-dasharray=\"2 2\" opacity=\".5\"><\u002Fline>\n          <line x1=\"4\" y1=\"23\" x2=\"16\" y2=\"23\" stroke-dasharray=\"2 2\" opacity=\".5\"><\u002Fline>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div class=\"feat-tag\"><span class=\"dot b\"><\u002Fspan>Sticky<\u002Fdiv>\n      <h3>Sticky Last Column<\u002Fh3>\n      <p>Action buttons always accessible. Auto-adapts when columns are toggled via the eye icon.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"feat-card\">\n      <span class=\"feat-num\">04<\u002Fspan>\n      <div class=\"feat-icon g\">\n        <svg viewBox=\"0 0 30 30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n          <rect x=\"3\" y=\"6\" width=\"14\" height=\"18\" rx=\"1.5\" opacity=\".5\"><\u002Frect>\n          <line x1=\"3\" y1=\"11\" x2=\"17\" y2=\"11\" opacity=\".5\"><\u002Fline>\n          <rect x=\"20\" y=\"6\" width=\"7\" height=\"5\" rx=\"1\" fill=\"currentColor\" fill-opacity=\".18\"><\u002Frect>\n          <rect x=\"20\" y=\"6\" width=\"7\" height=\"5\" rx=\"1\"><\u002Frect>\n          <ellipse cx=\"23.5\" cy=\"8.5\" rx=\"1.8\" ry=\"1.2\"><\u002Fellipse>\n          <circle cx=\"23.5\" cy=\"8.5\" r=\".5\" fill=\"currentColor\"><\u002Fcircle>\n          <path d=\"M19 16 L20.5 14.5 L19 13\" opacity=\".7\"><\u002Fpath>\n          <line x1=\"20.5\" y1=\"14.5\" x2=\"14\" y2=\"14.5\" stroke-dasharray=\"1.5 1.5\" opacity=\".7\"><\u002Fline>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div class=\"feat-tag\"><span class=\"dot\"><\u002Fspan>Layout<\u002Fdiv>\n      <h3>Eye Icon Merge<\u002Fh3>\n      <p>Relocates the column selector into the last header. Eliminates the wasted 54px column.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"feat-card\">\n      <span class=\"feat-num\">05<\u002Fspan>\n      <div class=\"feat-icon g\">\n        <svg viewBox=\"0 0 30 30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n          <rect x=\"4\" y=\"5\" width=\"22\" height=\"5\" rx=\"1\" stroke-dasharray=\"2 2\" opacity=\".5\"><\u002Frect>\n          <line x1=\"6\" y1=\"3\" x2=\"24\" y2=\"12\" stroke-width=\"1.5\" opacity=\".7\"><\u002Fline>\n          <line x1=\"4\" y1=\"14\" x2=\"26\" y2=\"14\"><\u002Fline>\n          <line x1=\"4\" y1=\"19\" x2=\"26\" y2=\"19\"><\u002Fline>\n          <line x1=\"4\" y1=\"24\" x2=\"26\" y2=\"24\"><\u002Fline>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div class=\"feat-tag\"><span class=\"dot\"><\u002Fspan>Layout<\u002Fdiv>\n      <h3>Hide Header<\u002Fh3>\n      <p>Completely hides the Datagrid 2 header row. Studio Pro warnings prevent conflicting configs.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"feat-card\">\n      <span class=\"feat-num\">06<\u002Fspan>\n      <div class=\"feat-icon o\">\n        <svg viewBox=\"0 0 30 30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n          <rect x=\"4\" y=\"5\" width=\"22\" height=\"20\" rx=\"1\"><\u002Frect>\n          <line x1=\"11.33\" y1=\"5\" x2=\"11.33\" y2=\"25\"><\u002Fline>\n          <line x1=\"18.67\" y1=\"5\" x2=\"18.67\" y2=\"25\"><\u002Fline>\n          <line x1=\"4\" y1=\"11.67\" x2=\"26\" y2=\"11.67\"><\u002Fline>\n          <line x1=\"4\" y1=\"18.33\" x2=\"26\" y2=\"18.33\"><\u002Fline>\n          <rect x=\"11.33\" y=\"11.67\" width=\"7.34\" height=\"6.66\" fill=\"currentColor\" fill-opacity=\".22\"><\u002Frect>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div class=\"feat-tag\"><span class=\"dot o\"><\u002Fspan>Styling<\u002Fdiv>\n      <h3>Cell Borders<\u002Fh3>\n      <p>Excel-style borders using a half-border technique — no doubling. Top &amp; bottom body overrides.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"feat-card\">\n      <span class=\"feat-num\">07<\u002Fspan>\n      <div class=\"feat-icon o\">\n        <svg viewBox=\"0 0 30 30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n          <text x=\"6\" y=\"13\" font-family=\"ui-monospace, monospace\" font-size=\"9\" font-weight=\"700\" fill=\"currentColor\" stroke=\"none\">Aa<\u002Ftext>\n          <line x1=\"18\" y1=\"9\" x2=\"26\" y2=\"9\"><\u002Fline>\n          <line x1=\"18\" y1=\"13\" x2=\"24\" y2=\"13\" opacity=\".6\"><\u002Fline>\n          <circle cx=\"8\" cy=\"20\" r=\"2.5\" fill=\"currentColor\" fill-opacity=\".4\"><\u002Fcircle>\n          <circle cx=\"14\" cy=\"20\" r=\"2.5\" fill=\"currentColor\" fill-opacity=\".7\"><\u002Fcircle>\n          <circle cx=\"20\" cy=\"20\" r=\"2.5\" fill=\"currentColor\"><\u002Fcircle>\n          <line x1=\"5\" y1=\"26\" x2=\"25\" y2=\"26\" stroke-width=\"2\"><\u002Fline>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div class=\"feat-tag\"><span class=\"dot o\"><\u002Fspan>Styling<\u002Fdiv>\n      <h3>Text Styling<\u002Fh3>\n      <p>Color, weight, transform for header, first &amp; last column — independent in Studio Pro.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"feat-card\">\n      <span class=\"feat-num\">08<\u002Fspan>\n      <div class=\"feat-icon p\">\n        <svg viewBox=\"0 0 30 30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n          <path d=\"M15 4 L26 23 L4 23 Z\" fill=\"currentColor\" fill-opacity=\".15\"><\u002Fpath>\n          <path d=\"M15 4 L26 23 L4 23 Z\"><\u002Fpath>\n          <line x1=\"15\" y1=\"11\" x2=\"15\" y2=\"17\"><\u002Fline>\n          <circle cx=\"15\" cy=\"20.2\" r=\".9\" fill=\"currentColor\" stroke=\"none\"><\u002Fcircle>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div class=\"feat-tag\"><span class=\"dot p\"><\u002Fspan>DX<\u002Fdiv>\n      <h3>Studio Pro Warnings<\u002Fh3>\n      <p>Design-time warnings in the Mendix problems pane catch conflicts before runtime.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"feat-card\">\n      <span class=\"feat-num\">09<\u002Fspan>\n      <div class=\"feat-icon p\">\n        <svg viewBox=\"0 0 30 30\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n          <path d=\"M7 14 a8 8 0 0 1 14.5 -4\"><\u002Fpath>\n          <path d=\"M23 16 a8 8 0 0 1 -14.5 4\"><\u002Fpath>\n          <path d=\"M21.5 6 L21.5 10 L17.5 10\"><\u002Fpath>\n          <path d=\"M8.5 24 L8.5 20 L12.5 20\"><\u002Fpath>\n          <circle cx=\"15\" cy=\"15\" r=\"2\" fill=\"currentColor\" fill-opacity=\".4\"><\u002Fcircle>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div class=\"feat-tag\"><span class=\"dot p\"><\u002Fspan>DX<\u002Fdiv>\n      <h3>Re-render Resilient<\u002Fh3>\n      <p>Survives re-renders from pagination, sorting, filtering, and column visibility toggling.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<!-- ───── CONFIG ───── -->\n<section class=\"section\" id=\"config\"><div class=\"container\">\n  <div class=\"section-head\">\n    <div class=\"section-label\">— configuration —<\u002Fdiv>\n    <h2 class=\"section-title\">Every setting lives in Studio Pro.<\u002Fh2>\n    <p class=\"section-desc\">The same dialog you see when you double-click the widget — click around to flip toggles, swap tabs, and scroll the real layout.<\u002Fp>\n  <\u002Fdiv>\n\n  <div class=\"cfg-frame\">\n    <div class=\"cfg-titlebar\">\n      <span>Edit Datagrid2 Plus 'datagrid2Plus1'<\u002Fspan>\n      <div class=\"cfg-titlebar-buttons\"><span>▢<\u002Fspan><span>✕<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"cfg\">\n      <div class=\"cfg-tabs\">\n        <div class=\"cfg-tab active\" onclick=\"showTab('gen',this)\">General<\u002Fdiv>\n        <div class=\"cfg-tab\" onclick=\"showTab('sty',this)\">Styling<\u002Fdiv>\n        <div class=\"cfg-tab\" onclick=\"showTab('kbd',this)\">Keyboard Shortcuts<\u002Fdiv>\n        <div class=\"cfg-tab\" onclick=\"showTab('com',this)\">Common<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"cfg-content active\" id=\"tab-gen\">\n        <div class=\"cfg-section-wrap\">\n          <div class=\"cfg-g\">Header Visibility<\u002Fdiv>\n          <div class=\"cfg-r\"><div class=\"cfg-l\">Hide Header<\u002Fdiv><div class=\"cfg-t\" onclick=\"cfgToggle(this)\"><span><span class=\"radio\"><\u002Fspan>Yes<\u002Fspan><span class=\"sel\"><span class=\"radio\"><\u002Fspan>No<\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <div class=\"cfg-d\">Completely hides the Mendix Datagrid 2 header row including sort buttons and column selector.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"cfg-section-wrap\">\n          <div class=\"cfg-g\">Sticky Options<\u002Fdiv>\n          <div class=\"cfg-r\"><div class=\"cfg-l\">Sticky Header<\u002Fdiv><div class=\"cfg-t\" onclick=\"cfgToggle(this)\"><span class=\"sel\"><span class=\"radio\"><\u002Fspan>Yes<\u002Fspan><span><span class=\"radio\"><\u002Fspan>No<\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <div class=\"cfg-d\">Enable sticky header for the Mendix Datagrid 2.<\u002Fdiv>\n          <div class=\"cfg-r\"><div class=\"cfg-l\">Sticky First Column<\u002Fdiv><div class=\"cfg-t\" onclick=\"cfgToggle(this)\"><span class=\"sel\"><span class=\"radio\"><\u002Fspan>Yes<\u002Fspan><span><span class=\"radio\"><\u002Fspan>No<\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <div class=\"cfg-d\">Enable sticky first column for the Mendix Datagrid 2.<\u002Fdiv>\n          <div class=\"cfg-r\"><div class=\"cfg-l\">Sticky Last Column<\u002Fdiv><div class=\"cfg-t\" onclick=\"cfgToggle(this)\"><span class=\"sel\"><span class=\"radio\"><\u002Fspan>Yes<\u002Fspan><span><span class=\"radio\"><\u002Fspan>No<\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <div class=\"cfg-d\">Enable sticky last column. Useful for action button columns.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"cfg-section-wrap\">\n          <div class=\"cfg-g\">Column Selector<\u002Fdiv>\n          <div class=\"cfg-r\"><div class=\"cfg-l\">Move Eye Icon to Last Col<\u002Fdiv><div class=\"cfg-t\" onclick=\"cfgToggle(this)\"><span class=\"sel\"><span class=\"radio\"><\u002Fspan>Yes<\u002Fspan><span><span class=\"radio\"><\u002Fspan>No<\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <div class=\"cfg-d\">Moves the column selector into the last data column header and hides the extra column Mendix generates.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"cfg-section-wrap\">\n          <div class=\"cfg-g\">Height Configuration<\u002Fdiv>\n          <div class=\"cfg-r\"><div class=\"cfg-l\">Max Height<\u002Fdiv><div class=\"cfg-v\">26rem<\u002Fdiv><\u002Fdiv>\n          <div class=\"cfg-d\">Maximum height for the datagrid content area. Required when Sticky Header is enabled.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"cfg-section-wrap\">\n          <div class=\"cfg-g\">Column Width Configuration<\u002Fdiv>\n          <div class=\"cfg-r\"><div class=\"cfg-l\">Default Min Width<\u002Fdiv><div class=\"cfg-v\">10rem<\u002Fdiv><\u002Fdiv>\n          <div class=\"cfg-d\">Default minimum width for all columns. First and Last column can be overridden below.<\u002Fdiv>\n          <div class=\"cfg-r\"><div class=\"cfg-l\">First Column Min Width<\u002Fdiv><div class=\"cfg-v empty\"><\u002Fdiv><\u002Fdiv>\n          <div class=\"cfg-d\">Override minimum width for the first column. Leave empty to use the default.<\u002Fdiv>\n          <div class=\"cfg-r\"><div class=\"cfg-l\">Last Column Min Width<\u002Fdiv><div class=\"cfg-v empty\"><\u002Fdiv><\u002Fdiv>\n          <div class=\"cfg-d\">Override minimum width for the last column. Leave empty to use the default.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"cfg-content\" id=\"tab-sty\">\n        <div class=\"cfg-section-wrap\">\n          <div class=\"cfg-g\">Cell Borders<\u002Fdiv>\n          <div class=\"cfg-r\"><div class=\"cfg-l\">Cell Border<\u002Fdiv><div class=\"cfg-v\">1px solid #333<\u002Fdiv><\u002Fdiv>\n          <div class=\"cfg-d\">Excel-style borders on every cell. Free-form CSS shorthand. Half-border technique — no doubling.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"cfg-section-wrap\">\n          <div class=\"cfg-g\">Body Borders<\u002Fdiv>\n          <div class=\"cfg-r\"><div class=\"cfg-l\">Top Border<\u002Fdiv><div class=\"cfg-v\">none<\u002Fdiv><\u002Fdiv>\n          <div class=\"cfg-d\">Override the top border on the first body row's cells.<\u002Fdiv>\n          <div class=\"cfg-r\"><div class=\"cfg-l\">Bottom Border<\u002Fdiv><div class=\"cfg-v\">none<\u002Fdiv><\u002Fdiv>\n          <div class=\"cfg-d\">Override the bottom border on the last body row's cells.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"cfg-section-wrap\">\n          <div class=\"cfg-g\">Sticky Borders<\u002Fdiv>\n          <div class=\"cfg-r\"><div class=\"cfg-l\">Enable Sticky Borders<\u002Fdiv><div tacks up against the usual workarounds — theme CSS, one-off widgets, or living with the defaults.<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"compare\">\n    <table>\n      <thead>\n        <tr><th><\u002Fth><th class=\"us\">Datagrid2+<\u002Fth><th>Theme CSS<\u002Fth><th>Custom Widget<\u002Fth><\u002Ftr>\n      <\u002Fthead>\n      <tbody>\n        <tr><td>Sticky header<\u002Ftd><td class=\"us check\">●<\u002Ftd><td class=\"check\">●<\u002Ftd><td class=\"check\">●<\u002Ftd><\u002Ftr>\n        <tr><td>Sticky first / last column<\u002Ftd><td class=\"us check\">●<\u002Ftd><td class=\"x\">○ tricky<\u002Ftd><td class=\"check\">●<\u002Ftd><\u002Ftr>\n        <tr><td>Auto-adapts to column toggles<\u002Ftd><td class=\"us check\">●<\u002Ftd><td class=\"x\">○<\u002Ftd><td class=\"x\">○ manual<\u002Ftd><\u002Ftr>\n        <tr><td>Eye-icon merge (kills 54px col)<\u002Ftd><td class=\"us check\">●<\u002Ftd><td class=\"x\">○<\u002Ftd><td class=\"x\">○ DOM hack<\u002Ftd><\u002Ftr>\n        <tr><td>Configurable from Studio Pro<\u002Ftd><td class=\"us check\">●<\u002Ftd><td class=\"x\">○<\u002Ftd><td class=\"check\">●<\u002Ftd><\u002Ftr>\n        <tr><td>Design-time warnings<\u002Ftd><td class=\"us check\">●<\u002Ftd><td class=\"x\">○<\u002Ftd><td class=\"x\">○<\u002Ftd><\u002Ftr>\n        <tr><td>Multiple instances safe<\u002Ftd><td class=\"us check\">●<\u002Ftd><td class=\"x\">○ leaks<\u002Ftd><td class=\"check\">●<\u002Ftd><\u002Ftr>\n        <tr><td>Re-render resilient<\u002Ftd><td class=\"us check\">●<\u002Ftd><td class=\"check\">●<\u002Ftd><td class=\"x\">○ depends<\u002Ftd><\u002Ftr>\n        <tr><td>Time to ship<\u002Ftd><td class=\"us\">≈ 2 minutes<\u002Ftd><td>days<\u002Ftd><td>weeks<\u002Ftd><\u002Ftr>\n      <\u002Ftbody>\n    <\u002Ftable>\n  <\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<!-- ───── INSTALL ───── -->\n<section class=\"section\" id=\"install\"><div class=\"container\">\n  <div class=\"section-head\">\n    <div class=\"section-label\">— get started —<\u002Fdiv>\n    <h2 class=\"section-title\">Install in three steps.<\u002Fh2>\n    <p class=\"section-desc\">Drop-in installation — no npm, no CLI, no custom code, just the .mpk file and Studio Pro.<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"install-wrap\">\n    <div class=\"install-stage\" id=\"install-stage\">\n      <div class=\"install-titlebar\">\n        <div class=\"dots\"><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><\u002Fdiv>\n        <div class=\"where\" id=\"install-where\">~/MyMendixApp<\u002Fdiv>\n        <span id=\"install-step-tag\">step 01<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"install-body\" id=\"install-body\">\n        <!-- Stage 1: Finder showing widgets folder -->\n        <div class=\"finder\" id=\"finder\">\n          <div class=\"path\">\n            <span class=\"seg\">MyMendixApp<\u002Fspan><span>›<\u002Fspan><span class=\"seg\" id=\"path-tail\">widgets<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"row dir\"><span class=\"ico\">▸<\u002Fspan> javasource <span class=\"sz\">14 items<\u002Fspan><\u002Fdiv>\n          <div class=\"row dir\"><span class=\"ico\">▾<\u002Fspan> widgets <span class=\"sz\">3 items<\u002Fspan><\u002Fdiv>\n          <div class=\"row\" style=\"padding-left:1.4rem\"><span class=\"ico\">▢<\u002Fspan> ChartsWidget.mpk <span class=\"sz\">412 KB<\u002Fspan><\u002Fdiv>\n          <div class=\"row\" style=\"padding-left:1.4rem\"><span class=\"ico\">▢<\u002Fspan> CalendarPlus.mpk <span class=\"sz\">96 KB<\u002Fspan><\u002Fdiv>\n          <div class=\"row\" style=\"padding-left:1.4rem\"><span class=\"ico\">▢<\u002Fspan> SidebarMenu.mpk <span class=\"sz\">58 KB<\u002Fspan><\u002Fdiv>\n          <div class=\"row dir\"><span class=\"ico\">▸<\u002Fspan> theme <span class=\"sz\">8 items<\u002Fspan><\u002Fdiv>\n          <div class=\"row\"><span class=\"ico\">▢<\u002Fspan> MyMendixApp.mpr <span class=\"sz\">2.4 MB<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- The flying .mpk -->\n        <div class=\"mpk-pkg\" id=\"mpk-pkg\" style=\"top:-80px;right:1rem;opacity:0\">\n          <div class=\"mpk-ico\">.mpk<\u002Fdiv>\n          <div class=\"mpk-name\">Datagrid2Plus.mpk<small>~ 80 KB · GitHub release<\u002Fsmall><\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- Stage 3: Studio Pro toolbox -->\n        <div class=\"toolbox\" id=\"toolbox\">\n          <div class=\"toolbox-head\">Toolbox · Pluggable Widgets<\u002Fdiv>\n          <div class=\"toolbox-search\"><input value=\"datagrid\" readonly=\"\"><\u002Fdiv>\n          <div class=\"toolbox-list\" id=\"tb-list\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"install-script\">\n      <div class=\"script-step\" data-step=\"0\">\n        <div class=\"num\"><em>01<\u002Fem><\u002Fdiv>\n        <div><h4>Download the .mpk<\u002Fh4><p>Grab <code>Datagrid2Plus.mpk<\u002Fcode> from the latest GitHub release.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"script-step\" data-step=\"1\">\n        <div class=\"num\"><em>02<\u002Fem><\u002Fdiv>\n        <div><h4>Drop it into <code>widgets/<\u002Fcode><\u002Fh4><p>Move the .mpk into your project's <code>widgets<\u002Fcode> folder. Mendix auto-detects new widgets next time you focus the app.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"script-step\" data-step=\"2\">\n        <div class=\"num\"><em>03<\u002Fem><\u002Fdiv>\n        <div><h4>Press <kbd>F4<\u002Fkbd> in Studio Pro<\u002Fh4><p>Synchronizes the widgets folder. Datagrid2+ appears in the toolbox, ready to drag onto a page.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"script-controls\">\n        <button class=\"script-btn primary\" id=\"script-play\">▶  Play install<\u002Fbutton>\n        <div class=\"script-progress\"><div id=\"script-bar\"><\u002Fdiv><\u002Fdiv>\n        <button class=\"script-btn\" id=\"script-replay\">↻<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<!-- ───── TECH ───── -->\n<section class=\"section\" id=\"technical\"><div class=\"container\">\n  <div class=\"section-head\">\n    <div class=\"section-label\">— under the hood —<\u002Fdiv>\n    <h2 class=\"section-title\">Built like Mendix expects.<\u002Fh2>\n    <p class=\"section-desc\">For developers who want to know how it works — runtime architecture, the DOM-merge trick, and the CSS strategy that survives re-renders.<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"tech-grid\">\n    <div class=\"tch\"><h3><span class=\"tag tag-blue\">Arch<\u002Fspan> How it works<\u002Fh3><p>Wraps your Datagrid 2 in a container. MutationObserver watches for re-renders, then applies sticky positioning and DOM manipulation. Dynamic styles injected per-instance via scoped style tags with <code>!important<\u002Fcode> to override Mendix inline grid-template-columns.<\u002Fp><\u002Fdiv>\n    <div class=\"tch\"><h3><span class=\"tag tag-green\">Compat<\u002Fspan> Compatibility<\u002Fh3><ul>\n      <li>Mendix 9.24.x, 10.x, 11.6+ (MTS)<\u002Fli>\n      <li>Data Widgets 3.7 (table) &amp; 3.8+ (CSS Grid)<\u002Fli>\n      <li>Mendix React Client<\u002Fli>\n      <li>Zero external runtime dependencies<\u002Fli>\n      <li>Scoped per instance — multiple grids safe<\u002Fli>\n    <\u002Ful><\u002Fdiv>\n    <div class=\"tch\"><h3><span class=\"tag tag-orange\">CSS<\u002Fspan> Sticky positioning<\u002Fh3><p>Header uses <code>position: sticky<\u002Fcode> on <code>.widget-datagrid-grid-head<\u002Fcode>. First column uses <code>nth-child<\u002Fcode> CSS. Last column applied via JS — Mendix column-selector offset needs runtime detection.<\u002Fp><\u002Fdiv>\n    <div class=\"tch\"><h3><span class=\"tag tag-purple\">DOM<\u002Fspan> Eye icon merge<\u002Fh3><p>Original button element <strong>moved<\u002Fstrong> (not cloned) into last data <code>th<\u002Fcode> — Mendix React event handlers preserved. Column-selector grid track overridden to 0px via dedicated style tag.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<!-- ───── FAQ ───── -->\n<section class=\"section\" id=\"faq\"><div class=\"container\">\n  <div class=\"section-head\">\n    <div class=\"section-label\">— FAQ —<\u002Fdiv>\n    <h2 class=\"section-title\">Questions, answered.<\u002Fh2>\n  <\u002Fdiv>\n  <div class=\"faq-list\">\n    <div class=\"faq-item\"><div class=\"faq-q\" onclick=\"toggleFaq(this)\"><span class=\"num\">01<\u002Fspan><span>Does Datagrid2+ work with Mendix 10?<\u002Fspan><span class=\"arr\">+<\u002Fspan><\u002Fdiv><div class=\"faq-a\"><div class=\"faq-a-inner\">Yes. Compatible with Mendix 10, Datagrid 2 CSS Grid with subgrid, Mendix 9.24, and 11.6+ MTS.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"faq-item\"><div class=\"faq-q\" onclick=\"toggleFaq(this)\"><span class=\"num\">02<\u002Fspan><span>Can I use the eye icon merge without sticky?<\u002Fspan><span class=\"arr\">+<\u002Fspan><\u002Fdiv><div class=\"faq-a\"><div class=\"faq-a-inner\">Yes. The merge feature works independently. Enable it alone to reclaim the 54px column Mendix adds.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"faq-item\"><div class=\"faq-q\" onclick=\"toggleFaq(this)\"><span class=\"num\">03<\u002Fspan><span>What happens when users hide columns?<\u002Fspan><span class=\"arr\">+<\u002Fspan><\u002Fdiv><div class=\"faq-a\"><div class=\"faq-a-inner\">Datagrid2+ re-detects the new last column and reapplies positioning. Set the last column to <code>Hide: No<\u002Fcode> in Mendix Column Capabilities for best results.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"faq-item\"><div class=\"faq-q\" onclick=\"toggleFaq(this)\"><span class=\"num\">04<\u002Fspan><span>Multiple Mendix datagrids on one page?<\u002Fspan><span class=\"arr\">+<\u002Fspan><\u002Fdiv><div class=\"faq-a\"><div class=\"faq-a-inner\">Fully scoped per instance. No style leaks between datagrids.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"faq-item\"><div class=\"faq-q\" onclick=\"toggleFaq(this)\"><span class=\"num\">05<\u002Fspan><span>Is Datagrid2+ free?<\u002Fspan><span class=\"arr\">+<\u002Fspan><\u002Fdiv><div class=\"faq-a\"><div class=\"faq-a-inner\">Yes. Datagrid2+ is free and open to use — download the latest <code>.mpk<\u002Fcode> from <a href=\"https://github.com/tapmaurer-repo/mendix-widget-datagrid2-plus-public\">GitHub<\u002Fa>.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"faq-item\"><div class=\"faq-q\" onclick=\"toggleFaq(this)\"><span class=\"num\">06<\u002Fspan><span>External dependencies?<\u002Fspan><span class=\"arr\">+<\u002Fspan><\u002Fdiv><div class=\"faq-a\"><div class=\"faq-a-inner\">Zero. Drop the .mpk into your widgets folder, press F4.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"faq-item\"><div class=\"faq-q\" onclick=\"toggleFaq(this)\"><span class=\"num\">07<\u002Fspan><span>Dashboard grids without headers?<\u002Fspan><span class=\"arr\">+<\u002Fspan><\u002Fdiv><div class=\"faq-a\"><div class=\"faq-a-inner\">Hide Header toggle removes the header row entirely. Great for read-only display grids.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"faq-item\"><div class=\"faq-q\" onclick=\"toggleFaq(this)\"><span class=\"num\">08<\u002Fspan><span>Excel-style cell borders?<\u002Fspan><span class=\"arr\">+<\u002Fspan><\u002Fdiv><div class=\"faq-a\"><div class=\"faq-a-inner\">Cell Border property on the Styling tab. Half-border technique — no doubling.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"faq-item\"><div class=\"faq-q\" onclick=\"toggleFaq(this)\"><span class=\"num\">09<\u002Fspan><span>Bug reports and feature requests?<\u002Fspan><span class=\"arr\">+<\u002Fspan><\u002Fdiv><div class=\"faq-a\"><div class=\"faq-a-inner\">Open an issue on the <a href=\"https://github.com/tapmaurer-repo/mendix-widget-datagrid2-plus-public/issues\">GitHub repository<\u002Fa>.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<!-- ───── CTA ───── -->\n<section class=\"section\" id=\"download\" style=\"padding-bottom:3rem\"><div class=\"container\">\n  <div class=\"cta-card\">\n    <h2>Ready to upgrade your <em>Mendix datagrids?<\u002Fem><\u002Fh2>\n    <p>Download the latest release and drop it into your project — it really does take two minutes.<\u002Fp>\n    <div class=\"cta-buttons\">\n      <a href=\"https://github.com/tapmaurer-repo/mendix-widget-datagrid2-plus-public/releases/latest\" class=\"btn-fill\">Download v1.0.0 ↓<\u002Fa>\n      <a href=\"#install\" class=\"btn-outline\">Installation guide ↗<\u002Fa>\n    <\u002Fdiv>\n    <div class=\"cta-meta\">Free on GitHub · ~ 80 KB · Mendix 9.24 / 10 / 11.6+<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv><\u002Fsection>\n\n<!-- ───── FOOTER ───── -->\n<footer><div class=\"container\">\n  <div class=\"footer-grid\">\n    <div class=\"footer-brand\"><div class=\"icon-box\">DG2+<\u002Fdiv>Datagrid2+<\u002Fdiv>\n    <div class=\"footer-mid\">Built with care by <a href=\"https://timothymaurer.nl\">Tim Maurer<\u002Fa> · Mendix UX Engineer at Aiden<\u002Fdiv>\n    <div class=\"footer-meta\">v1.0.0<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv><\u002Ffooter>\n\n<script>\n/* ───────── Hero wireframe ───────── */\n(function(){\n  const HEADERS = ['ID','Customer','Status','Region','Owner','Updated','MRR','Plan'];\n  const ROWS = 14;\n  const SAMPLES = [\n    ['CUST-0142','Northwind','active','EMEA','M.Doe','2m ago','$4,200','Pro'],\n    ['CUST-0143','Acme Co.','pending','APAC','S.Lee','5m ago','$1,800','Std'],\n    ['CUST-0144','Globex','active','NA','J.Park','7m ago','$9,150','Ent'],\n    ['CUST-0145','Initech','progress','EMEA','A.Vidal','12m ago','$640','Std'],\n    ['CUST-0146','Umbrella','rejected','LATAM','R.Soto','24m ago','$2,300','Pro'],\n    ['CUST-0147','Soylent','active','NA','K.Yu','31m ago','$5,775','Pro'],\n    ['CUST-0148','Hooli','progress','EMEA','M.Doe','42m ago','$12,000','Ent'],\n    ['CUST-0149','Cyberdyne','active','APAC','S.Lee','1h ago','$3,420','Pro'],\n    ['CUST-0150','Tyrell','pending','NA','J.Park','1h ago','$890','Std'],\n    ['CUST-0151','Wonka','active','EMEA','A.Vidal','2h ago','$6,100','Pro'],\n    ['CUST-0152','Stark Ind.','active','NA','R.Soto','2h ago','$15,200','Ent'],\n    ['CUST-0153','Wayne Ent.','progress','LATAM','K.Yu','3h ago','$4,920','Pro'],\n    ['CUST-0154','Pied Piper','active','APAC','M.Doe','3h ago','$2,100','Std'],\n    ['CUST-0155','Massive Dyn.','rejected','EMEA','S.Lee','5h ago','$770','Std']\n  ];\n  const STATUS_CLASS = {active:'', pending:'hc-amber', progress:'', rejected:'hc-pink'};\n\n  function buildGrid(el, offset=0){\n    const frag = document.createDocumentFragment();\n    // header row\n    HEADERS.forEach(h=>{\n      const d = document.createElement('div');\n      d.className = 'hh';\n      d.textContent = h;\n      frag.appendChild(d);\n    });\n    // body rows\n    for(let r=0; r<ROWS; r++){\n      const sample = SAMPLES[(r+offset) % SAMPLES.length];\n      const isSelected = r === 4;\n      const isLive = r === 9;\n      sample.forEach((val, i)=>{\n        const d = document.createElement('div');\n        let cls = 'hc';\n        // text-bearing columns: 0 (ID), 1 (Customer), 5 (Updated), 7 (Plan)\n        // bar-only columns: 2 (Status pill), 3 (Region), 4 (Owner), 6 (MRR)\n        const showsText = (i===0 || i===1 || i===5 || i===7);\n        if(showsText){\n          d.textContent = val;\n          if(i===0) cls += ' hc-id';\n        } else {\n          // empty cell — render a bar\n          if(i===2){\n            cls += ' hc-pill ' + (STATUS_CLASS[val] || '');\n            if(isLive){ cls = cls.replace('hc-pill','').replace('hc-amber','').replace('hc-pink','') + ' hc-live'; }\n          } else if(i===6){\n            cls += ' hc-bar hc-num';\n          } else {\n            cls += ' hc-bar';\n          }\n        }\n        if(isSelected) cls += ' hc-sel';\n        d.className = cls.replace(/\\s+/g,' ').trim();\n        frag.appendChild(d);\n      });\n    }\n    el.appendChild(frag);\n  }\n\n  const g1 = document.getElementById('hero-grid-1');\n  const g2 = document.getElementById('hero-grid-2');\n  if(g1 && g2){\n    buildGrid(g1, 0);\n    buildGrid(g2, 7); // offset so the loop seam isn't obvious\n  }\n})();\n\n/* ───────── Playground ───────── */\nconst COLS=12;\n\nconst cols=['Name','Status','Active','Address','City','Country','Region','Code','Phone','Email','Dept','Actions'];\nconst rows=[\n['Viktor K.','In Progress','No','Dorpsstraat 12','Prague','Czech Rep.','Europe','CZ-01','+420 555','viktor@mail.cz','Sales','🗑'],\n['Anna P.','Rejected','No','Damrak 45','Berlin','Germany','Europe','DE-22','+49 170','anna@mail.de','HR','🗑'],\n['Sem Jansen','Completed','No','Herengracht 8','Stockholm','Sweden','Europe','SE-14','+46 70','sem@mail.se','Dev','🗑'],\n['Lisa de Vries','Active','Yes','Keizersgr. 92','Amsterdam','Netherlands','Europe','NL-09','+31 6','lisa@mail.nl','Design','🗑'],\n['James Wilson','Pending','No','Hoofdstraat 3','Brussels','Belgium','Europe','BE-03','+32 47','james@mail.be','Ops','🗑'],\n['Maria Santos','Active','Yes','Prinsengr. 17','Madrid','Spain','Europe','ES-41','+34 612','maria@mail.es','Sales','🗑'],\n['Tom Brown','In Progress','No','Singel 201','Paris','France','Europe','FR-75','+33 6','tom@mail.fr','Dev','🗑'],\n['Yuki Tanaka','Completed','Yes','Rokin 55','Tokyo','Japan','Asia','JP-13','+81 90','yuki@mail.jp','PM','🗑'],\n['Peter Lee','Rejected','No','Vijzelstr. 88','Vienna','Austria','Europe','AT-01','+43 660','peter@mail.at','QA','🗑'],\n['Sarah Miller','Active','Yes','Overtoom 142','London','UK','Europe','UK-SW','+44 77','sarah@mail.uk','Sales','🗑'],\n['Chen Wei','Pending','No','Kalverstr. 31','Shanghai','China','Asia','CN-31','+86 138','chen@mail.cn','Dev','🗑'],\n['Emma Davis','Active','Yes','Spuistr. 67','Toronto','Canada','N. Am.','CA-ON','+1 416','emma@mail.ca','HR','🗑'],\n];\nconst colW=[130,110,70,140,90,95,80,70,95,140,70,70];\nconst g=document.getElementById('dg');\ng.style.gridTemplateColumns=colW.map(w=>w+'px').join(' ');\ng.style.minWidth=colW.reduce((a,b)=>a+b,0)+'px';\n\nfunction statusPill(v){\n  const map={'Active':'s-active','Pending':'s-pending','In Progress':'s-progress','Rejected':'s-rejected','Completed':'s-completed'};\n  return `<span class=\"status-pill ${map[v]||'s-completed'}\">${v}<\u002Fspan>`;\n}\n\nlet h='';\ncols.forEach((c,i)=>h+=`<div class=\"c ch ${i===COLS-1?'ca':''}\">${c}<\u002Fdiv>`);\nrows.forEach(r=>r.forEach((v,i)=>{\n  let content = v;\n  if(i===1){ content = statusPill(v); }\n  if(i===2){ content = `<span style=\"font-family:var(--mono);color:${v==='Yes'?'var(--accent)':'var(--muted-2)'}\">${v}<\u002Fspan>`; }\n  if(i===0){ content = `<span style=\"font-weight:500;color:var(--ink)\">${v}<\u002Fspan>`; }\n  if(i===7||i===8||i===9){ content = `<span style=\"font-family:var(--mono);font-size:.72rem\">${v}<\u002Fspan>`; }\n  h+=`<div class=\"c cb ${i===COLS-1?'ca':''}\">${content}<\u002Fdiv>`;\n}));\ng.innerHTML=h;\n\nconst styleEl=document.createElement('style');\nstyleEl.textContent=`\n.demo-scroll.s-h .ch{position:sticky;top:0;z-index:3}\n.demo-scroll.s-h .ch::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent);opacity:.6}\n.demo-scroll.s-f .c:nth-child(${COLS}n+1){position:sticky;left:0;z-index:2;border-right:3px solid var(--accent);background:var(--surface);box-shadow:4px 0 12px -4px rgba(20,111,245,.35)}\n.demo-scroll.s-f .ch:nth-child(${COLS}n+1){z-index:4;background:var(--surface-2)}\n.demo-scroll.s-l .c:nth-child(${COLS}n+${COLS}){position:sticky;right:0;z-index:2;border-left:3px solid var(--accent);background:var(--surface);box-shadow:-4px 0 12px -4px rgba(20,111,245,.35)}\n.demo-scroll.s-l .ch:nth-child(${COLS}n+${COLS}){z-index:4;background:var(--surface-2)}\n.demo-scroll.s-h.s-f .ch:nth-child(${COLS}n+1){z-index:5}\n.demo-scroll.s-h.s-l .ch:nth-child(${COLS}n+${COLS}){z-index:5}\n`;\ndocument.head.appendChild(styleEl);\n\nconst st={h:false,f:false,l:false,hh:false,cb:true};\nfunction flip(k,el){st[k]=!st[k];el.querySelector('.sw').classList.toggle('on',st[k]);applyDemo()}\nfunction applyDemo(){\n  const ds=document.getElementById('ds');ds.className='demo-scroll';\n  if(st.hh){document.querySelectorAll('#dg .ch').forEach(c=>c.style.display='none')}\n  else{document.querySelectorAll('#dg .ch').forEach(c=>c.style.display='');if(st.h)ds.classList.add('s-h')}\n  if(st.f)ds.classList.add('s-f');\n  if(st.l)ds.classList.add('s-l');\n  document.querySelectorAll('#dg .c').forEach(c=>{\n    if(st.cb){c.style.borderRight='1px solid var(--hairline)';c.style.borderBottom='1px solid var(--hairline)'}\n    else{c.style.borderRight='1px solid transparent';c.style.borderBottom='1px solid transparent'}\n  });\n}\napplyDemo();\n\nfunction showTab(n,el){\n  document.querySelectorAll('.cfg-content').forEach(c=>c.classList.remove('active'));\n  document.querySelectorAll('.cfg-tab').forEach(t=>t.classList.remove('active'));\n  document.getElementById('tab-'+n).classList.add('active');\n  el.classList.add('active');\n}\nfunction cfgToggle(el){\n  const opts = [...el.children];\n  const isFirst = opts[0].classList.contains('sel');\n  opts[0].classList.toggle('sel', !isFirst);\n  opts[1].classList.toggle('sel', isFirst);\n}\nfunction cfgEnum(e){\n  const span=e.target.closest('.cfg-e > span');\n  if(!span)return;\n  const parent=span.parentElement;\n  parent.querySelectorAll(':scope > span').forEach(s=>s.classList.remove('sel'));\n  span.classList.add('sel');\n}\nfunction toggleFaq(el){\n  const item=el.parentElement;\n  const a=item.querySelector('.faq-a');\n  const open=item.classList.contains('open');\n  document.querySelectorAll('.faq-item').forEach(i=>{i.classList.remove('open');i.querySelector('.faq-a').style.maxHeight='0'});\n  if(!open){item.classList.add('open');a.style.maxHeight=a.scrollHeight+'px'}\n}\n\n/* ───────── Install animation ───────── */\n(function(){\n  const stage = document.getElementById('install-stage');\n  const finder = document.getElementById('finder');\n  const mpk = document.getElementById('mpk-pkg');\n  const toolbox = document.getElementById('toolbox');\n  const tbList = document.getElementById('tb-list');\n  const where = document.getElementById('install-where');\n  const tag = document.getElementById('install-step-tag');\n  const bar = document.getElementById('script-bar');\n  const playBtn = document.getElementById('script-play');\n  const replayBtn = document.getElementById('script-replay');\n  const steps = [...document.querySelectorAll('.script-step')];\n\n  let timers = [];\n  function clearTimers(){timers.forEach(t=>clearTimeout(t));timers=[]}\n  function at(ms,fn){timers.push(setTimeout(fn,ms))}\n\n  const widgets = [\n    {n:'Calendar Plus',c:'CP'},\n    {n:'Charts Widget',c:'CW'},\n    {n:'Datagrid 2', c:'D2'},\n    {n:'Sidebar Menu', c:'SM'},\n    {n:'Tab Container', c:'TC'},\n  ];\n\n  function reset(){\n    clearTimers();\n    bar.style.width='0%';\n    where.textContent='~/MyMendixApp';\n    tag.textContent='step 01';\n    finder.style.display='flex';\n    finder.style.opacity='1';\n    toolbox.style.opacity='0';\n    toolbox.style.pointerEvents='none';\n    mpk.style.transition='none';\n    mpk.style.top='-80px';mpk.style.right='1rem';mpk.style.left='auto';\n    mpk.style.opacity='0';mpk.style.transform='scale(.9)';\n    /* clear injected new row */\n    const newRow = finder.querySelector('.row.new'); if(newRow) newRow.remove();\n    steps.forEach(s=>s.classList.remove('active','done'));\n    tbList.innerHTML = widgets.map((w,i)=>`<div class=\"tb-item\"><div class=\"tb-ico\">${w.c}<\u002Fdiv>${w.n}<\u002Fdiv>`).join('');\n  }\n\n  function setStep(i){\n    steps.forEach((s,idx)=>{\n      s.classList.toggle('active', idx===i);\n      s.classList.toggle('done', idx<i);\n    });\n    tag.textContent = 'step '+String(i+1).padStart(2,'0');\n  }\n\n  function play(){\n    reset();\n    /* Step 1: download — mpk drops in from top */\n    setStep(0);\n    at(150, ()=>{\n      mpk.style.transition='all .9s cubic-bezier(.5,1.4,.4,1)';\n      mpk.style.top='1rem';\n      mpk.style.opacity='1';\n      mpk.style.transform='scale(1)';\n    });\n    at(400, ()=>{ bar.style.width='25%'; });\n\n    /* Step 2: drag into widgets/ */\n    at(1500, ()=>{\n      setStep(1);\n      where.textContent='~/MyMendixApp/widgets';\n      bar.style.width='55%';\n      /* fly to slot in finder list */\n      mpk.style.top='auto';\n      mpk.style.bottom='8rem';\n      mpk.style.right='auto';\n      mpk.style.left='1rem';\n      mpk.style.transform='scale(.85)';\n    });\n    at(2400, ()=>{\n      /* land — fade mpk and inject NEW row in finder */\n      mpk.style.transition='all .35s';\n      mpk.style.opacity='0';\n      mpk.style.transform='scale(.7)';\n      const r = document.createElement('div');\n      r.className='row new';\n      r.style.paddingLeft='1.4rem';\n      r.innerHTML='<span class=\"ico\">▢<\u002Fspan> Datagrid2Plus.mpk <span class=\"sz\">80 KB<\u002Fspan>';\n      const target = finder.querySelectorAll('.row')[4]; /* after SidebarMenu */\n      target.after(r);\n    });\n\n    /* Step 3: F4 → swap to Studio Pro toolbox */\n    at(3500, ()=>{\n      setStep(2);\n      where.textContent='Studio Pro › Toolbox';\n      bar.style.width='80%';\n      finder.style.transition='opacity .4s';\n      finder.style.opacity='0';\n      at(400, ()=>{ finder.style.display='none'; });\n      toolbox.style.opacity='1';\n      toolbox.style.pointerEvents='auto';\n    });\n    at(4400, ()=>{\n      /* Insert Datagrid2+ into the toolbox list with highlight */\n      const newItem = document.createElement('div');\n      newItem.className='tb-item hi fade';\n      newItem.innerHTML='<div class=\"tb-ico\">D+<\u002Fdiv>Datagrid2+ <span style=\"margin-left:auto;font-family:var(--mono);font-size:.66rem;color:var(--accent-2)\">new<\u002Fspan>';\n      /* insert after Datagrid 2 */\n      const items = tbList.querySelectorAll('.tb-item');\n      items[2].after(newItem);\n      bar.style.width='100%';\n    });\n    at(5400, ()=>{\n      steps.forEach(s=>s.classList.add('done'));\n      steps.forEach(s=>s.classList.remove('active'));\n      tag.textContent='done';\n    });\n  }\n\n  /* play once when scrolled into view */\n  let played=false;\n  const io = new IntersectionObserver(es=>{\n    es.forEach(e=>{\n      if(e.isIntersecting && !played){played=true; play();}\n    });\n  },{threshold:.4});\n  io.observe(stage);\n\n  playBtn.addEventListener('click', play);\n  replayBtn.addEventListener('click', play);\n\n  reset();\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
